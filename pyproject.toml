[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "rampa"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "Roger G. March, M\u00edriam Herrero" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "duckdb>=1.3.2",
    "ipython",
    "jupyterlab",
    "matplotlib",
    "notebook",
    "numpy",
    "pandas",
    "geopandas",
    "pip",
    "python-dotenv",
    "ruff",
    "scikit-learn",
    "arcgis",
    "tqdm>=4.67.1",
    "loguru"
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["rampa"]
include = ["pyproject.toml", "rampa/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["rampa"]
force-sort-within-sections = true

