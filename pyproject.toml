[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "rampa"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "Roger G. March, M\u00edriam Herrero" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "duckdb>=1.3.2",
    "ipython",
    "jupyterlab",
    "matplotlib",
    "notebook",
    "numpy",
    "pandas",
    "geopandas",
    "pip",
    "python-dotenv",
    "ruff",
    "scikit-learn",
    "arcgis",
    "tqdm>=4.67.1",
    "loguru",
    "osmnx>=2.0.6",
    "pandana>=0.7",
    "sqlalchemy>=2.0.43",
    "duckdb-engine>=0.17.0",
    "seaborn>=0.13.2",
    "folium>=0.20.0",
    "tomli>=2.2.1",
    "tomli-w>=1.2.0",
    "topojson>=1.10",
    "pytopojson>=1.1.2",
]
requires-python = "~=3.12.0"

[project.scripts]
rampa-setup = "setup:main"
rampa-cleanup = "cleanup_databases:main"
rampa-transform = "rampa.duckdb.src.run_transformations:main"

[tool.uv]
dev-dependencies = [
    "ruff>=0.3.0",
    "pytest>=8.0.0",
    "ipykernel>=6.29.0",
]

[tool.ruff]
line-length = 99
src = ["rampa"]
include = ["pyproject.toml", "rampa/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["rampa"]
force-sort-within-sections = true

